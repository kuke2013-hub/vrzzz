<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111722">
<title>Hello World · VR Objects</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b111b;color:#f2f6f8;display:grid;place-items:center;padding:36px 20px}
main{width:min(680px,100%)}
small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#79c9c2;font-weight:700}
h1{font-size:clamp(42px,8vw,72px);letter-spacing:-.055em;margin:9px 0 4px;font-weight:750}
p{color:#a6b5c1;font-size:16px;line-height:1.55}
hr{border:0;border-top:1px solid #263542;margin:31px 0}
h2{font-size:16px;letter-spacing:.02em;margin:0 0 14px}
a{color:#9ce6dc}
#directory{display:grid;gap:10px}
.object{display:block;text-decoration:none;border:1px solid #263744;background:#121d29;border-radius:14px;padding:18px 20px;transition:border-color .15s,transform .15s}
.object:hover{border-color:#75c9bf;transform:translateY(-2px)}
.name{font-size:19px;font-weight:700;color:#f4f8fa;display:block}
.desc{font-size:13px;color:#a6b6c4;display:block;margin-top:6px;line-height:1.5}
.state{font-size:11px;display:inline-block;margin-top:10px;color:#8db6bb}
#catalogue-status{color:#b4c4cf;font-size:13px}
footer{font-size:12px;color:#94a8b7;margin-top:30px}
footer a{color:#add9df}
</style>
</head>
<body>
<main>
  <small>Mixed reality / Meta Quest 3</small>
  <h1>Hello World.</h1>
  <p>An expanding library of independent VR objects. Select an object to enter its own passthrough experience.</p>
  <hr>
  <h2>Object directory</h2>
  <div id="directory" aria-live="polite"></div>
  <p id="catalogue-status" role="status">Loading object catalogue…</p>
  <footer>Built on the shared Zelda VR v13 controller system. <a href="./v13.html">Open the original Zelda v13 experience</a>.</footer>
</main>
<script>
(async()=>{
 const directory=document.getElementById('directory'),status=document.getElementById('catalogue-status');
 try{
  const response=await fetch('./objects/manifest.json',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const manifest=await response.json();
  if(!Array.isArray(manifest.objects))throw new Error('Invalid catalogue');
  let shown=0;
  for(const object of manifest.objects){
   if(!/^[a-z0-9-]+$/.test(object.id)||object.url!=='./objects/'+object.id+'/')continue;
   const link=document.createElement('a');link.className='object';link.href=object.url;
   const name=document.createElement('span');name.className='name';name.textContent=object.title||object.id;
   const desc=document.createElement('span');desc.className='desc';desc.textContent=object.description||'Quest 3 object';
   const state=document.createElement('span');state.className='state';state.textContent=object.status==='ready'?'Model published':'Model upload pending';
   link.append(name,desc,state);directory.append(link);shown++;
  }
  status.textContent=shown?'Showing '+shown+' object'+(shown===1?'':'s')+'.':'No objects yet.';
 }catch(error){status.textContent='Could not load the catalogue: '+error.message;}
})();
</script>
</body>
</html>
