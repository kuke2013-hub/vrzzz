name: Publish Zelda Quest passthrough
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Verify model and page
        run: |
          test -s index.html
          test -s app.js
          test "$(wc -c < assets/zelda.glb | tr -d ' ')" = 11668312
          echo '6da87f491b37c80eab5cebef794476468ea1af08bc253b949a9c33646aef4739  assets/zelda.glb' | sha256sum -c -
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
