name: Publish Daphne Sexy model from verified transfer chunks
on:
  push:
    branches: [main]
    paths:
      - 'objects/daphne-sexy/.transfer/**'
      - '.github/workflows/assemble-daphne-sexy.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore self-contained GLB and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          transfer='objects/daphne-sexy/.transfer'
          model='objects/daphne-sexy/assets/daphne-sexy.glb'
          mkdir -p "$(dirname "$model")"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for i in $(seq -w 1 21); do
            test -f "$transfer/part$i.b64"
            base64 --decode "$transfer/part$i.b64" >> "$tmp/model.xz"
          done
          xz --decompress --stdout "$tmp/model.xz" > "$model"
          test "$(wc -c < "$model" | tr -d ' ')" = '20017088'
          echo '894458111b74dd717dd3f612d76d6c0fdf043794f9ebb39d34c0cc66fbbb42a6  objects/daphne-sexy/assets/daphne-sexy.glb' | sha256sum --check
          test "$(head -c 4 "$model")" = 'glTF'
          rm -rf "$transfer"
      - name: Publish verified GLB
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A objects/daphne-sexy/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified self-contained Daphne Sexy GLB'
            git push origin HEAD:main
          fi
