name: Publish Evil Angel Woman model from verified transfer chunks
on:
  push:
    branches: [main]
    paths:
      - 'objects/evil-angel-woman/.transfer/**'
      - '.github/workflows/assemble-evil-angel.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore self-contained GLB and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          transfer='objects/evil-angel-woman/.transfer'
          model='objects/evil-angel-woman/assets/evil-angel-woman.glb'
          mkdir -p "$(dirname "$model")"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for i in $(seq -w 1 30); do
            test -f "$transfer/part$i.b64"
            base64 --decode "$transfer/part$i.b64" >> "$tmp/model.xz"
          done
          xz --decompress --stdout "$tmp/model.xz" > "$model"
          test "$(wc -c < "$model" | tr -d ' ')" = '25674324'
          echo '6e87345a336b3108fa167b1cd970b0dd3976840e34ffc96ab03eca93f1be5575  objects/evil-angel-woman/assets/evil-angel-woman.glb' | sha256sum --check
          test "$(head -c 4 "$model")" = 'glTF'
          rm -rf "$transfer"
      - name: Publish verified GLB
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A objects/evil-angel-woman/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified self-contained Evil Angel Woman GLB'
            git push origin HEAD:main
          fi
