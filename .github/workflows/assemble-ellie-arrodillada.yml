name: Assemble Ellie Arrodillada Quest 3 GLB
on:
  push:
    branches: [main]
    paths:
      - 'objects/ellie-arrodillada/.transfer/**'
      - '.github/workflows/assemble-ellie-arrodillada.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VR Objects
        uses: actions/checkout@v4
      - name: Restore and verify the exact optimized model
        shell: bash
        run: |
          set -euo pipefail
          transfer='objects/ellie-arrodillada/.transfer'
          model='objects/ellie-arrodillada/assets/ellie-arrodillada.glb'
          mkdir -p "$(dirname "$model")"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for i in $(seq -w 1 21); do
            test -f "$transfer/part$i.xz"
            cat "$transfer/part$i.xz" >> "$tmp/model.xz"
          done
          test "$(wc -c < "$tmp/model.xz" | tr -d ' ')" = '8158020'
          printf '%s  %s\n' '305038f995b41c1fc07a6e2ad49a10c96228ee032a375b48d9e3c38dfd77e324' "$tmp/model.xz" | sha256sum --check
          xz --decompress --stdout "$tmp/model.xz" > "$model"
          test "$(wc -c < "$model" | tr -d ' ')" = '18269332'
          echo '6392e02d78e884149f662bf797483440849bcd49585a0d18cf06e6366e5c0086  objects/ellie-arrodillada/assets/ellie-arrodillada.glb' | sha256sum --check
          test "$(head -c 4 "$model")" = 'glTF'
          rm -rf "$transfer"
      - name: Mark catalogue ready only after model verification
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path('objects/manifest.json')
          data = json.loads(path.read_text())
          records = [o for o in data['objects'] if o.get('id') == 'ellie-arrodillada']
          assert len(records) == 1, 'Ellie catalogue entry missing or duplicated'
          assert records[0]['model'] == './objects/ellie-arrodillada/assets/ellie-arrodillada.glb'
          records[0]['status'] = 'ready'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Commit verified model and clean transfer files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A objects/ellie-arrodillada/ objects/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Ellie Arrodillada Quest 3 GLB'
            git push origin HEAD:main
          fi
