name: Publish Colour Female 06 P06 from verified GLB transfer
on:
  push:
    branches: [main]
    paths:
      - 'objects/colour-female-06-p06/.transfer/**'
      - '.github/workflows/assemble-colour-female-06-p06.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Reassemble, checksum and validate the original GLB
        shell: bash
        run: |
          set -euo pipefail
          transfer='objects/colour-female-06-p06/.transfer'
          model='objects/colour-female-06-p06/assets/colour-female-06-p06.glb'
          mkdir -p "$(dirname "$model")"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for i in $(seq 0 22); do
            part="$(printf '%03d' "$i")"
            if [ "$i" -eq 0 ]; then
              base64 --decode "$transfer/part000.b64" >> "$tmp/model.glb.xz"
            else
              cat "$transfer/part$part"a.b64 "$transfer/part$part"b.b64 | base64 --decode >> "$tmp/model.glb.xz"
            fi
          done
          echo 'd9c6d005b79bca7c52634d2da215a237b30fa08e86b574192f97e67acbe0c609  '"$tmp/model.glb.xz" | sha256sum --check
          xz --decompress --stdout "$tmp/model.glb.xz" > "$model"
          test "$(wc -c < "$model" | tr -d ' ')" = '18364828'
          echo 'a116ac95a56bdd52416f689944bf41f5c568f5432ac6310bfb92fb1295f3a004  '"$model" | sha256sum --check
          test "$(head -c 4 "$model")" = 'glTF'
          rm -rf "$transfer"
          python3 -c 'import json; p="objects/manifest.json"; d=json.load(open(p)); next(x for x in d["objects"] if x["id"] == "colour-female-06-p06")["status"]="ready"; open(p,"w").write(json.dumps(d,indent=2)+"\n")'
      - name: Publish verified model and update catalogue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A objects/colour-female-06-p06/ objects/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Colour Female 06 P06 GLB and mark ready'
            git push origin HEAD:main
          fi
